[package]
name = "fantijiandu"
version = "0.1.0"
description = "繁体简读：把繁体电子书读成简体"
authors = ["lilinhao100"]
license = "MIT"
repository = "https://github.com/lilinhao100/fanti-jiandu"
edition = "2021"
rust-version = "1.77"

[lib]
name = "fantijiandu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
fontdb = "0.23"
ttf-parser = "0.25"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
